name: CI
on: [push, pull_request]
jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # pubspec.yaml lists the ttu asset directories, which are git-ignored
      # and only exist once this has run.
      - name: Fetch ttu build
        run: tool/fetch_ttu.sh

      - name: Install dependencies
        run: flutter pub get

      # Generated files are committed; fail if any of them is stale.
      - name: Check generated files
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang
          git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
