pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def sdkPath = properties.getProperty("flutter.sdk")
        assert sdkPath != null, "flutter.sdk not set in local.properties"
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Held at the versions Flutter 3.44 considers current (its
    // DependencyVersionChecker warns below AGP 8.11.1 / KGP 2.2.20 and errors
    // below AGP 8.6 / Gradle 8.7). Deliberately NOT the 9.x line the
    // `flutter create` template emits: AGP 9 drops the legacy variant API that
    // app/build.gradle uses to rename APKs and offset per-ABI version codes,
    // and Gradle 9 removes `jcenter()`, which several plugins in this graph
    // still call from their own buildscript blocks.
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

// Several plugins in this dependency graph ship an `android/build.gradle` from
// the AGP 3/4 era whose `buildscript` block lists only `google()` and the
// long-dead `jcenter()`. Those blocks are resolved per-project, so anything
// they need that jcenter used to serve (local_assets_server, for instance,
// asks for `kotlin-gradle-plugin:1.3.50`) has nowhere to come from. Seeding
// every project's buildscript repositories before its script runs gives those
// blocks a live source without touching the packages themselves.
// AGP 8 also requires every Android module to declare a `namespace`, and to
// compile against an SDK new enough for the AndroidX artifacts it pulls in.
// Several plugins here predate both: they declare only a manifest `package` and
// pin compileSdk as low as 28. Filling those in keeps the packages hosted and
// updatable -- vendoring a patched copy of each would freeze them at today's
// source, which is how this project's git-pinned forks became a liability.
//
// Both shims live here rather than in the root build.gradle because
// `evaluationDependsOn(":app")` makes some subprojects finish evaluating before
// the root project does; by then AGP has already read compileSdk and rejects a
// write. `beforeProject` fires before any project is evaluated, so the
// `afterEvaluate` it registers is always ahead of AGP's own.
gradle.beforeProject { project ->
    project.buildscript.repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    project.afterEvaluate {
        if (project != project.rootProject && project.hasProperty("android")) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 36
                defaultConfig {
                    // Some plugins still declare minSdk 16 (async_zip builds
                    // native code and the current NDK refuses anything below
                    // 21). The app's floor is 24, so raising a library to match
                    // it changes nothing about what actually ships.
                    if (minSdk == null || minSdk < 24) {
                        minSdk = 24
                    }
                }
            }
        }
    }
}

include ":app"
