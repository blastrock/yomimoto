name: yuuna
description: A full-featured immersion language learning suite for mobile.
publish_to: 'none'
version: 2.9.1+200
environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  async_zip: ^0.1.0
  audio_service: ^0.18.9
  audio_session: ^0.2.4
  beautiful_soup_dart: ^0.3.0
  blurrycontainer:
    git:
      url: https://github.com/arianneorpilla/blurry_container/
      ref: fb26dd1fa81edeb048b14703f1c1f28e93ee43d0
  cached_network_image: ^3.2.3
  cached_network_svg_image: ^2.0.0
  cancelable_compute: ^2.1.1
  carousel_slider: ^5.1.2
  change_notifier_builder: ^1.1.2
  chat_gpt_sdk: ^3.1.6
  clipboard: ^3.0.14
  collection:
  copy_with_extension: ^17.0.0
  crop_image: ^1.0.4
  dart_mappable: ^4.7.0
  device_info_plus: ^13.2.0
  dio: ^5.1.1
  document_file_save_plus: ^2.0.0
  expandable: ^5.0.1
  external_app_launcher: ^4.0.4
  external_path: ^3.0.0
  favicon: ^1.1.1
  ffmpeg_kit_flutter_new: ^4.6.2
  file_picker: ^12.0.0
  filesystem_picker:
    # Vendored jidoujisho fork: multi-root browsing, usedFiles highlighting and
    # marquee filenames, none of which upstream 4.1.0 has. See
    # vendor/filesystem_picker/UPSTREAM.md.
    path: vendor/filesystem_picker
  float_column: ^4.1.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_cache_manager: ^3.3.0
  flutter_charset_detector: ^6.0.0
  flutter_colorpicker: ^1.0.3
  flutter_exit_app: ^2.1.2
  flutter_gpt_tokenizer: ^0.1.0
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_image_compress: ^2.5.1
  flutter_inappwebview: ^6.1.5
  flutter_launcher_icons: ^0.14.4
  flutter_logs: ^2.1.11 
  flutter_native_splash: ^2.2.8
  flutter_riverpod: ^2.3.6
  flutter_staggered_grid_view: ^0.7.0
  flutter_vlc_player: ^7.4.4
  fluttertoast: ^10.0.0
  google_fonts: ^8.2.1
  hive: ^2.0.6
  hive_flutter: ^1.1.0
  html: ^0.15.2
  http: ^1.0.0
  image_picker: ^1.2.3
  # Held at 4.x: version 5 replaced PagingController wholesale
  # (firstPageKey/addPageRequestListener/appendPage -> fetchPage/state), which
  # is a UI rewrite across 4 files and no part of a toolchain migration. 4.1.0
  # supports Dart 3.
  infinite_scroll_pagination: ^4.1.0
  intl: ^0.20.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  json_annotation: ^4.9.0
  json_serializable: ^6.6.1
  just_audio: ^0.10.6
  kana_kit: ^2.0.0
  lemmatizerx: ^1.0.0
  list_counter: ^1.0.2
  local_assets_server: ^2.0.2+12
  marquee: ^2.2.3
  material_floating_search_bar_2:
    # Vendored for one line: ThemeData.appBarTheme changed type to
    # AppBarThemeData after 0.5.0 was published. See
    # vendor/material_floating_search_bar_2/UPSTREAM.md.
    path: vendor/material_floating_search_bar_2
  mecab_dart:
    # Vendored: 0.1.6 still carries a `registerWith(Registrar)` companion from
    # the removed v1 Android embedding. See vendor/mecab_dart/UPSTREAM.md.
    path: vendor/mecab_dart
  multi_value_listenable_builder: ^0.0.2
  network_to_file_image: ^7.0.0
  nowplaying:
    # Vendored fork: carries an unupstreamed NPE fix in the notification
    # listener, and hosted 3.x is an API rewrite. Also swaps the dead
    # package_info for package_info_plus. See vendor/nowplaying/UPSTREAM.md.
    path: vendor/nowplaying
  package_info_plus: ^10.2.1
  path: ^1.8.2
  path_provider: ^2.0.13
  # Held at 12.x: permission_handler 13 pulls permission_handler_android 14,
  # which compiles against SDK 37. compileSdk here is 36 and targetSdk is
  # deliberately 32, so buying into a preview platform for one plugin is not
  # worth it.
  permission_handler: ^12.0.3
  progress_indicators: ^1.0.0
  quiver: ^3.2.1
  recase: ^4.1.0
  receive_intent:
    # Vendored upstream 0.2.7 with the fork's `setResult(action:)` patch
    # rebased on top. See vendor/receive_intent/UPSTREAM.md.
    path: vendor/receive_intent
  record_mp3_plus: ^1.5.0
  remove_emoji: ^0.0.7
  reorderables: ^0.6.0
  restart_app: ^1.1.2
  ruby_text:
    # Vendored jidoujisho fork: per-character styles and tap targets inside
    # furigana, which is what makes character-level lookup work. See
    # vendor/ruby_text/UPSTREAM.md.
    path: vendor/ruby_text
  scrollable_positioned_list: ^0.3.5
  share_plus: ^13.3.0
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  sliver_tools: ^0.2.12
  spaces:
    git:
      url: https://github.com/arianneorpilla/spaces
      ref: master
  stack_trace: ^1.11.1
  subtitle:
    git:
      url: https://github.com/arianneorpilla/subtitle
      ref: 36562dcda59c67c170f6e0a10ad5f775eb3341e3
  transparent_image: ^2.0.1
  uri_to_file: ^1.0.0
  url_launcher: ^6.0.20
  ve_dart:
    git:
      url: https://github.com/arianneorpilla/ve_dart
      ref: c366bb1ae24f6fad4f5c7e3a1efad5f2b8122e58
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.7.0
  youtube_explode_dart: ^3.1.0
  
dependency_overrides:
  freezed_annotation: ^2.2.0 # Caused by spaces
  gap: ^3.0.1 # Caused by spaces
  # ve_dart's fork pins `mecab_dart: 0.1.3` exactly, which still wants ffi ^1
  # and declares an sdk upper bound of <3.0.0. Override to the vendored 0.1.6,
  # which is on ffi ^2 and has the removed v1-embedding code stripped out. See
  # vendor/mecab_dart/UPSTREAM.md.
  mecab_dart:
    path: vendor/mecab_dart
  # local_assets_server 2.0.2+12 (dormant, latest) wants mime ^1 while
  # share_plus 13 wants ^2. The server's only mime call is `lookupMimeType`,
  # which is unchanged in mime 2, so forcing 2 is safe.
  mime: ^2.0.0
  # The subtitle fork pins `path >=1.8.0 <1.9.0`, which collides with
  # youtube_explode_dart 3's `path ^1.9.1`. path 1.8 -> 1.9 is additive, so
  # forcing it is safe. Remove once subtitle is vendored with a widened bound.
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.3.3
  # Pinned below 4.8: isar_community_generator 3.3.2 requires analyzer <11,
  # and dart_mappable_builder 4.8+ requires analyzer >=10/13. 4.7.x is the
  # newest release whose analyzer range overlaps isar's.
  dart_mappable_builder: ">=4.7.0 <4.8.0"
  # dependency_validator is pinned to analyzer <13 while dart_mappable_builder
  # requires ^13; it is a hygiene tool with no build role, so it stays out until
  # the two agree again.
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  
flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/meta/icon.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "assets/meta/icon-android12.png"

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/meta/
    - assets/language/japanese/ipadic/
    - assets/ttu-ebook-reader/
    - assets/ttu-ebook-reader/_app/
    - assets/ttu-ebook-reader/_app/immutable/
    - assets/ttu-ebook-reader/_app/immutable/assets/
    - assets/ttu-ebook-reader/_app/immutable/chunks/
    - assets/ttu-ebook-reader/_app/immutable/components/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/auth/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/b/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/manage/
    - assets/ttu-ebook-reader/_app/immutable/components/pages/settings/
    - assets/ttu-ebook-reader/auth/
    - assets/ttu-ebook-reader/b/
    - assets/ttu-ebook-reader/fonts/
    - assets/ttu-ebook-reader/icons/
    - assets/ttu-ebook-reader/manage/
    - assets/ttu-ebook-reader/settings/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.otf
        - asset: assets/fonts/NotoSansJP-Bold.otf
          weight: 700