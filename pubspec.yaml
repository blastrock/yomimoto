name: yuuna
description: A book reader, dictionary and card creation toolkit for e-ink Android devices.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  # Pure Dart zip reading for manga import: async_zip needs its native
  # library, which unit tests on the host cannot load.
  archive: ^4.0.9
  async_zip: ^0.1.0
  audio_session: ^0.2.4
  beautiful_soup_dart: ^0.3.0
  cached_network_image: ^3.2.3
  cancelable_compute: ^2.1.1
  carousel_slider: ^5.1.2
  collection:
  crop_image: ^1.0.4
  dart_mappable: ^4.7.0
  device_info_plus: ^13.2.0
  drift: ^2.35.2
  expandable: ^5.0.1
  external_app_launcher: ^4.0.4
  file_picker: ^12.0.0
  float_column: ^4.1.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.3.1
  flutter_cache_manager: ^3.3.0
  flutter_exit_app: ^2.1.2
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  flutter_image_compress: ^2.5.1
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^2.3.6
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^10.0.0
  # Held below 0.15.7, which removed the internal `matches` from
  # package:html/src/query_selector.dart. flutter_html 3.0.0 imports it, so
  # the release build stops compiling.
  html: '>=0.15.2 <0.15.7'
  # 1.5 for AbortableRequest, which cancels manga catalog downloads.
  http: ^1.5.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  json_annotation: ^4.9.0
  just_audio: ^0.10.6
  kana_kit: ^2.0.0
  list_counter: ^1.0.2
  marquee: ^2.2.3
  material_floating_search_bar_2:
    # Vendored for one line: ThemeData.appBarTheme changed type to
    # AppBarThemeData after 0.5.0 was published. See
    # vendor/material_floating_search_bar_2/UPSTREAM.md.
    path: vendor/material_floating_search_bar_2
  # lookupMimeType for TtuAssetPathHandler.
  mime: ^2.0.0
  multi_value_listenable_builder: ^0.0.2
  network_to_file_image: ^7.0.0
  package_info_plus: ^10.2.1
  path: ^1.8.2
  path_provider: ^2.0.13
  # Held at 12.x: permission_handler 13 pulls permission_handler_android 14,
  # which compiles against SDK 37. compileSdk here is 36 and targetSdk is
  # deliberately 32, so buying into a preview platform for one plugin is not
  # worth it.
  permission_handler: ^12.0.3
  receive_intent: ^0.2.8
  record_mp3_plus: ^1.5.0
  reorderables: ^0.6.0
  ruby_text:
    # Vendored jidoujisho fork: per-character styles and tap targets inside
    # furigana, which is what makes character-level lookup work. See
    # vendor/ruby_text/UPSTREAM.md.
    path: vendor/ruby_text
  share_plus: ^13.3.0
  slang: ^3.13.0
  slang_flutter: ^3.13.0
  sliver_tools: ^0.2.12
  # Bundles SQLite through its build hook; sqlite3_flutter_libs is end-of-life
  # and not needed.
  sqlite3: ^3.7.1
  stack_trace: ^1.11.1
  url_launcher: ^6.0.20
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.7.0

dev_dependencies:
  build_runner: ^2.3.3
  dart_mappable_builder: ^4.10.0
  drift_dev: ^2.35.1
  # dependency_validator is pinned to analyzer <13 while drift_dev and
  # dart_mappable_builder require ^13; it is a hygiene tool with no build role,
  # so it stays out until they agree again.

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.2.8
  flutter_test:
    sdk: flutter
  json_serializable: ^6.6.1

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/meta/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/meta/icon-android12.png"

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/
    - assets/meta/
    # ebook-reader-lite build (tool/fetch_ttu.sh). Flutter asset directories
    # are not recursive: every directory of the build must be listed, and
    # fetch_ttu.sh fails if one is missing.
    - assets/ttu-ebook-reader/
    - assets/ttu-ebook-reader/_app/
    - assets/ttu-ebook-reader/_app/immutable/
    - assets/ttu-ebook-reader/_app/immutable/assets/
    - assets/ttu-ebook-reader/_app/immutable/chunks/
    - assets/ttu-ebook-reader/_app/immutable/entry/
    - assets/ttu-ebook-reader/_app/immutable/nodes/
    - assets/ttu-ebook-reader/icons/
    # The manga reader page: hand-written, no build step.
    - assets/manga-reader/
